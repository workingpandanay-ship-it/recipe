<!doctype html>
<html lang="id">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body{font-family:Arial,sans-serif;max-width:620px;margin:auto;padding:16px;background:#f4f6f8;color:#17202a}
    h2{margin:4px 0 16px;font-size:22px}
    label{display:block;font-weight:700;margin:14px 0 6px}
    select,input,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #c9d2dc;border-radius:8px;font-size:16px}
    input,select{background:#fff}
    button{background:#17365d;color:#fff;border:0;margin-top:12px;font-weight:700;cursor:pointer}
    button.secondary{background:#596579}
    button:disabled{opacity:.55;cursor:not-allowed}
    #reader{margin-top:14px;background:#fff;border:1px solid #d8dee6;border-radius:10px;overflow:hidden;min-height:70px;padding:8px;box-sizing:border-box}
    #msg{padding:12px;background:#fff;border:1px solid #e0e5eb;border-radius:8px;margin:12px 0;min-height:24px;overflow-wrap:anywhere}
    .hint{font-size:13px;line-height:1.5;color:#5b6570}
    .good{color:#126b37}.bad{color:#a12622}
  </style>
</head>
<body>
  <h2>📷 Absensi QR Santriwati — Per Kelas</h2>
  <label for="activity">Aktivitas</label>
  <select id="activity"><option value="">Memuat aktivitas…</option></select>
  <label for="pembina">Nama pembina yang bertugas</label>
  <input id="pembina" placeholder="Contoh: Ustazah Inayah" autocomplete="name">
  <button id="startBtn" type="button">Mulai Scan QR</button>
  <button id="stopBtn" class="secondary" type="button" disabled>Hentikan Kamera</button>
  <div id="msg">Memuat daftar aktivitas…</div>
  <div id="reader"><p class="hint">Tekan “Mulai Scan QR” untuk mengaktifkan kamera. Izinkan akses kamera jika diminta.</p></div>
  <p class="hint">Pilih aktivitas dan isi nama pembina sebelum scan. QR berisi ID santriwati. Scan yang sama untuk aktivitas yang sama pada hari yang sama akan ditolak.</p>
<script>
let scanner=null, busy=false, loaded=false;
const msg=document.getElementById('msg');
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const activity=document.getElementById('activity');
const pembina=document.getElementById('pembina');
function say(text,cls=''){msg.className=cls;msg.textContent=text;}
function loadOptions(){
  google.script.run.withSuccessHandler(data=>{
    activity.innerHTML='';
    (data.aktivitas||[]).forEach(a=>{const opt=document.createElement('option');opt.value=a.nama;opt.textContent=a.nama;activity.appendChild(opt);});
    if(!activity.options.length){activity.innerHTML='<option value="">Tidak ada aktivitas</option>';say('Daftar aktivitas kosong. Periksa sheet AKTIVITAS.','bad');return;}
    loaded=true;say('Siap. Pilih aktivitas, isi nama pembina, lalu tekan Mulai Scan QR.','good');
  }).withFailureHandler(e=>say('Gagal memuat aktivitas: '+(e.message||e),'bad')).getOptions();
}
async function startScanner(){
  if(!loaded){say('Daftar aktivitas belum siap. Muat ulang halaman dan coba lagi.','bad');return;}
  if(!activity.value){say('Pilih aktivitas terlebih dahulu.','bad');return;}
  if(!pembina.value.trim()){say('Isi nama pembina terlebih dahulu.','bad');pembina.focus();return;}
  if(typeof Html5Qrcode==='undefined'){
    say('Pustaka pemindai QR tidak termuat. Pastikan internet aktif, lalu muat ulang halaman.','bad');return;
  }
  startBtn.disabled=true;
  try{
    if(!scanner) scanner=new Html5Qrcode('reader');
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},onScanSuccess,()=>{});
    stopBtn.disabled=false;say('Kamera aktif. Arahkan ke QR santriwati.','good');
  }catch(e){
    startBtn.disabled=false;
    say('Kamera gagal dibuka: '+(e.message||e)+'. Pastikan memakai URL Web App HTTPS, izinkan kamera, dan tutup aplikasi lain yang memakai kamera.','bad');
  }
}
function onScanSuccess(decodedText){
  if(busy)return;
  busy=true;
  say('QR terbaca: '+decodedText+'. Menyimpan absensi…');
  google.script.run.withSuccessHandler(r=>{
    say((r&&r.message)||'Respons diterima.',r&&r.ok?'good':'');
    setTimeout(()=>{busy=false;},1600);
  }).withFailureHandler(e=>{
    say('Gagal mencatat: '+(e.message||e),'bad');
    setTimeout(()=>{busy=false;},1800);
  }).recordScan(decodedText,activity.value,pembina.value.trim());
}
async function stopScanner(){
  if(scanner){try{await scanner.stop();}catch(e){} try{scanner.clear();}catch(e){} scanner=null;}
  document.getElementById('reader').innerHTML='<p class="hint">Kamera dihentikan. Tekan “Mulai Scan QR” untuk memindai lagi.</p>';
  startBtn.disabled=false;stopBtn.disabled=true;say('Kamera dihentikan.');
}
startBtn.addEventListener('click',startScanner);
stopBtn.addEventListener('click',stopScanner);
loadOptions();
</script>
</body>
</html>
